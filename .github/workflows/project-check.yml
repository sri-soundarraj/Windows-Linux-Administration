name: Windows & Linux Administration Project Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  project-check:
    name: Validate Project Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Repository Structure
        run: |
          echo "Checking project structure..."

          test -f README.md
          test -d Windows-Server
          test -d Linux
          test -d Networking
          test -d Virtualization

          echo "Project structure check completed successfully."

      - name: List Project Files
        run: |
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Validate Markdown Files
        run: |
          echo "Markdown files found:"
          find . -name "*.md" -type f
          echo "Markdown validation completed."
